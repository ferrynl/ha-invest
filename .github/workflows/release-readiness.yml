name: Release readiness

on:
  pull_request:
    paths:
      - 'portfolio/**'
      - 'tests/**'
      - 'CHANGELOG.md'
      - '.github/workflows/release-readiness.yml'
      - 'tools/check_release.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: portfolio/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r portfolio/requirements.txt
      - name: Check versions and release notes
        run: python tools/check_release.py
      - name: Run Python regression suite
        run: python -m unittest discover -s tests
      - name: Validate Docker build
        run: docker build -f portfolio/Dockerfile portfolio
