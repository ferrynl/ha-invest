name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r portfolio/requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_translations.py
      - run: node --check portfolio/app/static/i18n.js
      - run: node --check portfolio/app/static/translations.js
      - run: node --check portfolio/app/static/app.js
      - run: node --check portfolio/app/static/chart.js
      - run: node --check portfolio/app/static/chart-view.js
      - run: node --check portfolio/app/static/pages.js
      - run: node --check portfolio/app/static/access.js
      - run: node --check portfolio/app/static/imports.js
      - run: node --check portfolio/app/static/logs.js
      - run: node --check portfolio/app/static/currencies.js
      - run: node --check portfolio/app/static/import-mappings.js
      - run: node --check portfolio/app/static/import-issues.js
      - run: node --check portfolio/app/static/home.js
      - run: node --check portfolio/app/static/table-filters.js
      - run: node --check portfolio/app/static/stock-detail.js
      - run: node --check portfolio/app/static/transactions.js
      - run: node --check portfolio/app/static/category-status.js
      - run: node --check portfolio/app/static/dividends.js
      - run: node --check portfolio/app/static/stocks.js
      - run: node tests/test_i18n.cjs
      - run: node tests/test_broker_scope.cjs
      - run: node --check portfolio/app/static/report-charts.js
      - run: node --check portfolio/app/static/reports.js
      - run: node tests/test_reports.cjs
      - run: node tests/test_stocks.cjs
      - run: node tests/test_categories.cjs
      - run: node tests/test_tables.cjs
      - run: node tests/test_home.cjs
      - run: node tests/test_chart.cjs
      - run: docker build portfolio -t aandelen-dashboard:test
  release:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare version and release notes
        run: python scripts/release_notes.py
      - name: Publish missing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$APP_VERSION" >/dev/null 2>&1; then
            echo "Release v$APP_VERSION already exists."
          else
            gh release create "v$APP_VERSION" --target "$GITHUB_SHA" --title "Home Invest $APP_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
