name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r portfolio/requirements.txt -r feedback_service/requirements.txt
      - run: pip install -r portfolio/requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_translations.py
      - name: Discover and check JavaScript sources and tests
        run: python scripts/check_javascript.py
      - name: Lint Python
        run: |
          python -m pip install ruff
          ruff check portfolio/app feedback_service scripts tests
      - name: Lint JavaScript
        run: npx --yes eslint@9.39.1 "portfolio/app/static/**/*.{js,mjs,cjs}" "tests/**/*.{js,mjs,cjs}"
      - name: Verify add-on changelog mirrors canonical release notes
        run: python scripts/sync_changelog.py --check
      - name: Validate release metadata
        env:
          PYTHONPATH: scripts
        run: python -c "from pathlib import Path; from release_notes import prepare; prepare(Path.cwd())"
      - name: Browser smoke test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - run: docker build portfolio -t aandelen-dashboard:test
      - name: Verify installed portfolio container and database upgrades offline
        run: >-
          docker run --rm --network none
          -e PYTHONPATH=/app
          -v "$PWD/tests/test_release_reliability.py:/tests/test_release_reliability.py:ro"
          aandelen-dashboard:test python -m unittest discover -s /tests -p test_release_reliability.py -v
      - name: Check bundled Defeat Beta reader without network
        run: >-
          docker run --rm --network none aandelen-dashboard:test python -c
          "import fundamentals, duckdb; db=duckdb.connect(); db.execute('LOAD httpfs'); assert fundamentals.supported(('AAPL','NASDAQ','USD'))"
      - run: docker build -f feedback_service/Dockerfile -t home-invest-feedback:test .
      - run: docker run --rm --network none -v "$PWD/tests/smoke_feedback_container.py:/smoke.py:ro" home-invest-feedback:test python /smoke.py
      - name: Scan portfolio container
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: aandelen-dashboard:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan feedback container
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: home-invest-feedback:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  release:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare version and release notes
        run: python scripts/release_notes.py
      - name: Publish missing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$APP_VERSION" >/dev/null 2>&1; then
            echo "Release v$APP_VERSION already exists."
          else
            gh release create "v$APP_VERSION" --target "$GITHUB_SHA" --title "Home Invest $APP_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
