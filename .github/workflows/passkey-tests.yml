name: Passkey security tests
on:
  pull_request:
    paths:
      - 'portfolio/app/passkeys.py'
      - 'portfolio/app/security.py'
      - 'portfolio/app/migrations.py'
      - 'portfolio/app/web.py'
      - 'portfolio/app/static/access.js'
      - 'portfolio/app/static/index.html'
      - 'portfolio/requirements.txt'
      - 'portfolio/tests/test_passkeys.py'
      - '.github/workflows/passkey-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r portfolio/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q portfolio/app
      - name: Check browser JavaScript syntax
        run: node --check portfolio/app/static/access.js
      - name: Test WebAuthn
        env:
          PYTHONPATH: portfolio/app
        run: python -m unittest discover -s portfolio/tests -p 'test_passkeys.py' -v
