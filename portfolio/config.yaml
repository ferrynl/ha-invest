name: Home Invest
url: https://github.com/ferrynl/ha-invest
version: "0.70.37"
slug: aandelen_dashboard
description: >-
  Volg je beleggingen, rendement en dividend op één plek. Importeer transacties
  van meerdere brokers en bekijk je posities, koershistorie en dividendkalender.
  Je portefeuille wordt lokaal opgeslagen in Home Assistant.
arch: [amd64, aarch64]
startup: application
boot: auto
init: true
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-line
panel_title: Home Invest
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Alleen-lezen portefeuillewaarden voor Home Assistant (toegangssleutel vereist)
options:
  refresh_minutes: 15
  home_assistant_token: ""
  logo_dev_publishable_key: ""
  feedback_service_url: ""
schema:
  refresh_minutes: int(5,1440)
  home_assistant_token: password?
  logo_dev_publishable_key: str?
  feedback_service_url: str?
